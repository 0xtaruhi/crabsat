[package]
name = "crabsat"
version = "0.1.0"
edition = "2024"
description = "A high-performance CDCL SAT solver inspired by Kissat"
license = "MIT"
repository = "https://github.com/0xtaruhi/crabsat"
readme = "README.md"

[workspace]
members = ["ipasir"]

[dependencies]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 1

[profile.dev]
opt-level = 1
