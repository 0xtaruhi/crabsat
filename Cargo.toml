[package]
name = "crabsat"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "A high-performance CDCL SAT solver inspired by Kissat"
license = "MIT"
repository = "https://github.com/0xtaruhi/crabsat"
readme = "README.md"
documentation = "https://docs.rs/crabsat"
keywords = ["sat", "sat-solver", "cdcl", "ipasir", "incremental"]
categories = ["algorithms", "mathematics", "command-line-utilities"]
exclude = ["/.github", "/scripts", "/ipasir", "/include", "/examples"]

[workspace]
members = ["ipasir"]

[features]
default = ["compression"]
# Reading `.gz`, `.bz2`, `.xz` and `.lzma` inputs (pure Rust decoders).
compression = ["dep:flate2", "dep:bzip2", "dep:lzma-rust2"]

[dependencies]
flate2 = { version = "1.1", optional = true }
bzip2 = { version = "0.6", optional = true }
lzma-rust2 = { version = "0.22", optional = true, default-features = false, features = ["std", "xz", "optimization"] }

[dev-dependencies]
flate2 = "1.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 1

[profile.dev]
opt-level = 1
