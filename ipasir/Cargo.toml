[package]
name = "crabsat-ipasir"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "IPASIR C library (static and shared) of the crabsat SAT solver"
license = "MIT"
repository = "https://github.com/0xtaruhi/crabsat"
# A C library: built from the repository, not used as a crates.io dependency.
publish = false

[lib]
name = "crabsat_ipasir"
crate-type = ["staticlib", "cdylib"]

[dependencies]
crabsat = { path = ".." }
